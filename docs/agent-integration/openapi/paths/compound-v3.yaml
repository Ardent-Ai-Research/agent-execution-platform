---
"/protocols/compound-v3/supply/simulate":
  post:
    summary: Simulate Compound III Base Sepolia supply action
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CompoundSupplyRequest"
    responses:
      '200':
        description: Simulation result
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ExecutionResponse"
      '400':
        "$ref": "#/components/responses/ErrorResponse"
      '401':
        "$ref": "#/components/responses/ErrorResponse"
"/protocols/compound-v3/supply":
  post:
    summary: Execute Compound III Base Sepolia supply action
    parameters:
    - in: header
      name: X-Payment-Proof
      required: false
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CompoundSupplyRequest"
    responses:
      '200':
        description: Execution accepted/queued
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ExecutionResponse"
      '402':
        description: Payment required for manual mode
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PaymentRequiredBody"
      '400':
        "$ref": "#/components/responses/ErrorResponse"
      '401':
        "$ref": "#/components/responses/ErrorResponse"
