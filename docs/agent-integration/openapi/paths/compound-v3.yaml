"/protocols/compound-v3/position":
  get:
    summary: Read Compound III Base Sepolia position for an agent wallet
    parameters:
    - in: query
      name: agent_id
      required: true
      schema:
        type: string
    - in: query
      name: chain
      required: false
      schema:
        type: string
        enum:
        - base
        default: base
    - in: query
      name: market
      required: false
      schema:
        type: string
        enum:
        - usdc
        - weth
        default: usdc
    responses:
      '200':
        description: Compound position response
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CompoundPositionResponse"
      '400':
        "$ref": "#/components/responses/ErrorResponse"
      '401':
        "$ref": "#/components/responses/ErrorResponse"
"/protocols/compound-v3/balances":
  get:
    summary: Read Compound III Base Sepolia wallet and protocol balances
    parameters:
    - in: query
      name: agent_id
      required: true
      schema:
        type: string
    - in: query
      name: chain
      required: false
      schema:
        type: string
        enum:
        - base
        default: base
    - in: query
      name: market
      required: false
      schema:
        type: string
        enum:
        - usdc
        - weth
        default: usdc
    responses:
      '200':
        description: Compound balances response
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CompoundBalancesResponse"
      '400':
        "$ref": "#/components/responses/ErrorResponse"
      '401':
        "$ref": "#/components/responses/ErrorResponse"
