<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ardent aUSD Faucet</title>
    <meta
      name="description"
      content="Request aUSD testnet tokens by submitting your agent smart wallet address."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Geist+Mono:wght@300;400;500&family=Instrument+Serif:ital,wght@0,400;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --void: #f2f7f4;
        --void2: #eaf2ee;
        --void3: #dde9e4;
        --line: rgba(28, 37, 38, 0.12);
        --line2: rgba(28, 37, 38, 0.2);
        --ice: #f6fbf9;
        --dim: #61706c;
        --mid: #4f605e;
        --text: #2f3a39;
        --white: #1c2526;
        --blue: #586565;
        --cyan: #71807f;
        --nav-bg: rgba(242, 247, 244, 0.88);
        --input-bg: #f8fbfa;
        --input-placeholder: #90a09b;
        --amber: #f59e0b;
        --green: #10b981;
        --red: #f43f5e;
      }

      body.theme-dark {
        --void: #1c2526;
        --void2: #243032;
        --void3: #2d3b3d;
        --line: rgba(232, 242, 238, 0.14);
        --line2: rgba(232, 242, 238, 0.24);
        --ice: #263437;
        --dim: #a8b8b3;
        --mid: #becdc8;
        --text: #d4e0dc;
        --white: #f1f7f4;
        --blue: #b6c4c0;
        --cyan: #c9d7d3;
        --nav-bg: rgba(28, 37, 38, 0.9);
        --input-bg: #1f2a2c;
        --input-placeholder: #7f918c;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        background: var(--void);
        color: var(--text);
        font-family: "Manrope", sans-serif;
        line-height: 1.6;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 1;
        opacity: 0.4;
      }

      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        padding: 0 28px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        background: var(--nav-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }

      .nav-logo {
        font-family: "Bebas Neue", sans-serif;
        font-size: 20px;
        letter-spacing: 0.15em;
        color: var(--white);
      }

      .nav-logo span {
        color: var(--cyan);
      }

      .theme-toggle {
        border: 1px solid var(--line2);
        background: transparent;
        color: var(--dim);
        font-family: "Geist Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 6px 10px;
        border-radius: 2px;
        cursor: pointer;
        transition: color 0.2s, border-color 0.2s, background 0.2s;
      }

      .theme-toggle:hover {
        color: var(--white);
        border-color: var(--blue);
      }

      .wrap {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 90px 22px 30px;
      }

      .panel {
        width: 100%;
        max-width: 640px;
        border: 1px solid var(--line);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.06),
          rgba(255, 255, 255, 0.02)
        );
        border-radius: 14px;
        overflow: hidden;
      }

      .panel-head {
        border-bottom: 1px solid var(--line);
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .panel-title {
        font-family: "Geist Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--white);
      }

      .panel-badge {
        font-family: "Geist Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.1em;
        color: var(--green);
        border: 1px solid rgba(16, 185, 129, 0.25);
        background: rgba(16, 185, 129, 0.08);
        padding: 4px 8px;
        border-radius: 999px;
      }

      .panel-body {
        padding: 24px 20px 20px;
      }

      h1 {
        font-family: "Bebas Neue", sans-serif;
        letter-spacing: 0.06em;
        font-size: clamp(32px, 6vw, 52px);
        color: var(--white);
        line-height: 1;
      }

      .subtitle {
        margin-top: 10px;
        color: var(--dim);
        font-size: 14px;
      }

      .note {
        margin-top: 8px;
        color: var(--mid);
        font-size: 13px;
      }

      form {
        margin-top: 20px;
      }

      .label {
        font-size: 11px;
        font-family: "Geist Mono", monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--mid);
        margin-bottom: 8px;
      }

      input[type="text"] {
        width: 100%;
        border: 1px solid var(--line2);
        border-radius: 10px;
        background: var(--input-bg);
        color: var(--white);
        padding: 12px 12px;
        font-size: 14px;
        font-family: "Geist Mono", monospace;
        outline: none;
      }

      input[type="text"]::placeholder {
        color: var(--input-placeholder);
      }

      input[type="text"]:focus {
        border-color: var(--blue);
      }

      .submit {
        margin-top: 12px;
        width: 100%;
        border: 1px solid var(--line2);
        border-radius: 10px;
        background: var(--white);
        color: var(--void);
        padding: 12px;
        font-size: 12px;
        font-family: "Geist Mono", monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .submit:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .status {
        min-height: 20px;
        margin-top: 10px;
        font-size: 13px;
      }

      .status.error {
        color: var(--red);
      }

      .status.success {
        color: var(--green);
      }

      .foot {
        margin-top: 12px;
        font-size: 12px;
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-logo">Ardent <span>Research</span></div>
      <button id="theme-toggle" class="theme-toggle" aria-pressed="false">
        Theme: Light
      </button>
    </nav>

    <main class="wrap">
      <section class="panel">
        <div class="panel-head">
          <div class="panel-title">aUSD Faucet Request</div>
          <div class="panel-badge">SEPOLIA</div>
        </div>

        <div class="panel-body">
          <h1>REQUEST aUSD</h1>
          <p class="subtitle">
            Submit your <strong>agent smart wallet address</strong> to request testnet aUSD.
          </p>
          <p class="note">Only one field is required.</p>

          <form id="faucet-form" novalidate>
            <div class="label">Agent Smart Wallet Address</div>
            <input
              id="wallet-address"
              name="agent_smart_wallet_address"
              type="text"
              placeholder="0x1234567890abcdef1234567890abcdef12345678"
              autocomplete="off"
              required
            />

            <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none" />
            <input type="hidden" name="source" value="ardent-ausd-faucet-page" />
            <input type="hidden" name="token" value="aUSD" />
            <input type="hidden" name="network" value="ethereum-sepolia" />

            <button id="submit-btn" class="submit" type="submit">Submit Request</button>
            <div id="status" class="status"></div>
          </form>

          <p class="foot">Requests are reviewed before distribution.</p>
        </div>
      </section>
    </main>

    <script>
      const THEME_KEY = "ardent-theme";
      const themeToggle = document.getElementById("theme-toggle");

      function applyTheme(theme) {
        const isDark = theme === "dark";
        document.body.classList.toggle("theme-dark", isDark);
        themeToggle.textContent = `Theme: ${isDark ? "Dark" : "Light"}`;
        themeToggle.setAttribute("aria-pressed", String(isDark));
      }

      const savedTheme = localStorage.getItem(THEME_KEY);
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      applyTheme(savedTheme || (prefersDark ? "dark" : "light"));

      themeToggle.addEventListener("click", () => {
        const nextTheme = document.body.classList.contains("theme-dark") ? "light" : "dark";
        applyTheme(nextTheme);
        localStorage.setItem(THEME_KEY, nextTheme);
      });

      const ENDPOINT = "https://formspree.io/f/mlgznyag";
      const form = document.getElementById("faucet-form");
      const walletInput = document.getElementById("wallet-address");
      const submitBtn = document.getElementById("submit-btn");
      const statusEl = document.getElementById("status");

      function setStatus(message, type) {
        statusEl.textContent = message;
        statusEl.className = `status ${type || ""}`.trim();
      }

      function isValidWallet(value) {
        return /^0x[a-fA-F0-9]{40}$/.test(value);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        setStatus("");

        const wallet = walletInput.value.trim();
        if (!isValidWallet(wallet)) {
          setStatus("Please enter a valid EVM wallet address.", "error");
          walletInput.focus();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";

        try {
          const formData = new FormData(form);
          const response = await fetch(ENDPOINT, {
            method: "POST",
            body: formData,
            headers: { Accept: "application/json" },
          });

          if (!response.ok) {
            let message = "Request failed. Please try again.";
            try {
              const payload = await response.json();
              if (payload?.errors?.length) {
                message = payload.errors.map((error) => error.message).join(" ");
              }
            } catch (_) {}
            throw new Error(message);
          }

          form.reset();
          setStatus("Request received. We will process your faucet request shortly.", "success");
        } catch (error) {
          setStatus(error.message || "Could not submit request.", "error");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit Request";
        }
      });
    </script>
  </body>
</html>
